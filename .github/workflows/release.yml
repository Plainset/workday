name: Release

# Runs only for version tags pushed by maintainers (never for pull requests).
# Produces a DRAFT GitHub release; a maintainer reviews and publishes it manually.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches VERSION
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Tests
        run: ./scripts/test.sh
      - name: Package (ad-hoc signed; see docs/RELEASING.md for notarised builds)
        run: ./scripts/package_release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: dist/release/
          retention-days: 30

  draft-release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # only this job may create the (draft) release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" --draft --verify-tag \
            --title "Workday ${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md. Builds are ad-hoc signed and not notarised: right-click → Open on first launch. Verify downloads with SHA256SUMS.txt."
