name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: read-only token; no secrets are used by this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and validate release build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Dependency policy (no third-party packages)
        run: ./scripts/check_dependencies.sh
      - name: Unit tests
        run: ./scripts/test.sh
      - name: Release build and packaging
        run: ./scripts/package_release.sh
      - name: Validate app bundle
        run: |
          plutil -lint dist/Workday.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' dist/Workday.app/Contents/Info.plist)" = "$(cat VERSION)"
          lipo dist/Workday.app/Contents/MacOS/Workday -verify_arch arm64 x86_64
          codesign --verify --strict --verbose=2 dist/Workday.app
          (cd dist/release && shasum -a 256 -c SHA256SUMS.txt)
      - name: Smoke test (renders views from demo data, no user data)
        run: dist/Workday.app/Contents/MacOS/Workday --snapshot "$RUNNER_TEMP/snapshots" && ls "$RUNNER_TEMP/snapshots"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workday-build-${{ github.sha }}
          path: dist/release/
          retention-days: 7

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan
        run: ./gitleaks git --redact --verbose --exit-code 1 .
